
services:
  api:
    build: .
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  ui:
    build: .
    command: >
      python -m streamlit run ui/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      GRAHAKNYAY_API: http://api:8000
    depends_on:
      - api
